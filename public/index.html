<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestion de Caisse v2</title>
  <!-- Font Awesome 6 (icônes) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    /* ----- RESET ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 1400px;
      height: 96vh;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ----- HEADER ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      background: #ffffff;
      border-bottom: 1px solid #eef2f6;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0b1e33;
      letter-spacing: -0.3px;
    }
    .header h1 i {
      color: #2a7de1;
      margin-right: 10px;
    }
    .header .user-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header .user-info span {
      font-weight: 500;
      color: #2c3e50;
      background: #f1f5f9;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 14px;
    }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-logout:hover { background: #dc2626; }

    /* ----- BODY (sidebar + content) ----- */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar verticale */
    .sidebar {
      width: 220px;
      background: #f8fafc;
      border-right: 1px solid #e9edf2;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar .nav-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 12px 24px;
      background: transparent;
      border: none;
      border-radius: 0;
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      transition: 0.15s;
      border-left: 4px solid transparent;
    }
    .sidebar .nav-btn i {
      width: 22px;
      font-size: 18px;
      color: #64748b;
    }
    .sidebar .nav-btn:hover {
      background: #eef2f6;
      color: #0b1e33;
    }
    .sidebar .nav-btn.active {
      background: #ffffff;
      color: #1d4ed8;
      border-left-color: #1d4ed8;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
    }
    .sidebar .nav-btn.active i {
      color: #1d4ed8;
    }

    /* Zone de contenu */
    .content {
      flex: 1;
      padding: 28px 36px;
      overflow-y: auto;
      background: #ffffff;
    }

    /* Pages */
    .page { display: none; }
    .page.active { display: block; }

    /* ----- DASHBOARD ----- */
    .solde {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      padding: 30px 32px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 28px;
      box-shadow: 0 8px 24px rgba(15,23,42,0.15);
    }
    .solde h2 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.3px;
    }
    .solde h2 span {
      font-size: 48px;
      font-weight: 700;
      display: block;
      margin-top: 6px;
      background: linear-gradient(to right, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: #f8fafc;
      padding: 18px 14px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #eef2f6;
    }
    .stat-item h3 {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }
    .stat-item p {
      font-size: 26px;
      font-weight: 700;
      color: #0b1e33;
    }

    /* ----- FORMULAIRES ----- */
    .form-group {
      margin-bottom: 22px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      background: #fafcff;
      transition: 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
    }
    .btn-primary {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover { background: #1e40af; transform: translateY(-1px); }
    .btn-secondary {
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary:hover { background: #cbd5e1; }
    .alert {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
    }
    .alert.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .alert.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* ----- HISTORIQUE ----- */
    .historique-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .historique-toolbar input {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 40px;
      font-size: 14px;
      background: #fafcff;
    }
    .historique-toolbar input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table th {
      background: #f1f5f9;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: #334155;
      border-bottom: 2px solid #e2e8f0;
    }
    table td {
      padding: 12px 16px;
      border-bottom: 1px solid #eef2f6;
      vertical-align: middle;
    }
    table tr:hover { background: #f8fafc; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      background: #e2e8f0;
      color: #1e293b;
    }
    .badge-retrait { background: #dbeafe; color: #1d4ed8; }
    .badge-depot { background: #d1fae5; color: #065f46; }
    .badge-depense { background: #fee2e2; color: #991b1b; }

    /* ----- REÇU (popup) ----- */
    .recu-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .recu-overlay.active {
      display: flex;
    }
    .recu-card {
      background: white;
      max-width: 540px;
      width: 100%;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .recu-card h2 {
      font-size: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px dashed #e2e8f0;
      padding-bottom: 14px;
    }
    .recu-card .recu-content p {
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dotted #eef2f6;
      padding: 6px 0;
    }
    .recu-card .recu-content p strong {
      color: #334155;
    }
    .recu-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .recu-actions .btn-primary,
    .recu-actions .btn-secondary {
      flex: 1;
      justify-content: center;
      min-width: 120px;
    }

    /* ----- LOGIN ----- */
    .login-box {
      max-width: 400px;
      margin: 60px auto;
      background: white;
      padding: 40px 36px;
      border-radius: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      border: 1px solid #eef2f6;
    }
    .login-box h1 {
      text-align: center;
      margin-bottom: 28px;
      color: #0b1e33;
      font-size: 28px;
    }
    .login-box .btn-primary { width: 100%; justify-content: center; }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 820px) {
      .sidebar { width: 64px; padding: 12px 0; }
      .sidebar .nav-btn span { display: none; }
      .sidebar .nav-btn { justify-content: center; padding: 12px; }
      .sidebar .nav-btn i { margin: 0; }
      .content { padding: 20px; }
    }
    @media print {
      .no-print { display: none !important; }
      .recu-card { box-shadow: none; border: 1px solid #ccc; }
      .recu-overlay { position: static; background: white; backdrop-filter: none; padding: 0; }
    }
  </style>
</head>
<body>
<div class="container" id="app">

  <!-- PAGE LOGIN -->
  <div id="page-login" class="page active" style="display:flex; align-items:center; justify-content:center; height:100%;">
    <div class="login-box">
      <h1><i class="fas fa-lock" style="color:#1d4ed8;"></i> Connexion</h1>
      <div id="login-error" class="alert error"></div>
      <form id="login-form">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="login-email" required placeholder="exemple@domaine.com">
        </div>
        <div class="form-group">
          <label><i class="fas fa-key"></i> Mot de passe</label>
          <input type="password" id="login-password" required placeholder="Votre mot de passe">
        </div>
        <button type="submit" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Se connecter</button>
      </form>
    </div>
  </div>

  <!-- PAGE PRINCIPALE -->
  <div id="page-main" class="page" style="display:flex; flex-direction:column; height:100%;">
    <!-- Header -->
    <div class="header">
      <h1><i class="fas fa-wallet"></i> Gestion de Caisse v2</h1>
      <div class="user-info">
        <span id="user-email"></span>
        <button class="btn-logout no-print" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
      </div>
    </div>

    <div class="main">
      <!-- Sidebar -->
      <div class="sidebar no-print">
        <button class="nav-btn active" data-page="dashboard"><i class="fas fa-chart-pie"></i> <span>Tableau de bord</span></button>
        <button class="nav-btn" data-page="depot"><i class="fas fa-arrow-down"></i> <span>Nouveau dépôt</span></button>
        <button class="nav-btn" data-page="depense"><i class="fas fa-arrow-up"></i> <span>Nouvelle dépense</span></button>
        <button class="nav-btn" data-page="retrait"><i class="fas fa-credit-card"></i> <span>Nouveau retrait</span></button>
        <button class="nav-btn" data-page="historique"><i class="fas fa-history"></i> <span>Historique</span></button>
      </div>

      <!-- Content -->
      <div class="content">
        <!-- Dashboard -->
        <div id="sub-dashboard" class="page active">
          <div class="solde">
            <h2>💰 Solde actuel <span id="solde">0.00</span> FCFA</h2>
          </div>
          <div class="stats">
            <div class="stat-item"><h3>Total dépôts</h3><p id="total-depots">0.00</p></div>
            <div class="stat-item"><h3>Total dépenses</h3><p id="total-depenses">0.00</p></div>
            <div class="stat-item"><h3>Total retraits</h3><p id="total-retraits">0.00</p></div>
          </div>
        </div>

        <!-- Dépôt -->
        <div id="sub-depot" class="page">
          <h2><i class="fas fa-arrow-down" style="color:#16a34a;"></i> Enregistrer un dépôt</h2>
          <div id="depot-msg" class="alert"></div>
          <form id="depot-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="depot-montant" required></div>
            <div class="form-group"><label>Provenance</label><input type="text" id="depot-provenance" required placeholder="Ex: Vente, Client, ..."></div>
            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
          </form>
        </div>

        <!-- Dépense -->
        <div id="sub-depense" class="page">
          <h2><i class="fas fa-arrow-up" style="color:#dc2626;"></i> Enregistrer une dépense</h2>
          <div id="depense-msg" class="alert"></div>
          <form id="depense-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="depense-montant" required></div>
            <div class="form-group"><label>Motif</label><input type="text" id="depense-motif" required placeholder="Ex: Achat fournitures"></div>
            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Enregistrer</button>
          </form>
        </div>

        <!-- Retrait -->
        <div id="sub-retrait" class="page">
          <h2><i class="fas fa-credit-card" style="color:#7c3aed;"></i> Enregistrer un retrait</h2>
          <div id="retrait-msg" class="alert"></div>
          <form id="retrait-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="retrait-montant" required></div>
            <div class="form-group"><label>Mode</label>
              <select id="retrait-mode">
                <option value="Espèce">Espèce</option>
                <option value="Orange Money">Orange Money</option>
                <option value="Wave">Wave</option>
              </select>
            </div>
            <div class="form-group"><label>Nom du client</label><input type="text" id="retrait-nom" required></div>
            <div class="form-group"><label>Numéro de téléphone</label><input type="tel" id="retrait-telephone" required></div>
            <div class="form-group"><label>Code client (4 lettres majuscules)</label>
              <input type="text" id="retrait-code" maxlength="4" pattern="[A-Z]{4}" required placeholder="EX: ABCD" style="text-transform:uppercase;">
            </div>
            <button type="submit" class="btn-primary"><i class="fas fa-file-invoice"></i> Enregistrer &amp; générer le reçu</button>
          </form>
        </div>

        <!-- Historique -->
        <div id="sub-historique" class="page">
          <h2><i class="fas fa-history" style="color:#2563eb;"></i> Historique des opérations</h2>
          <div class="historique-toolbar">
            <input type="text" id="search-historique" placeholder="🔍 Rechercher par nom, motif, provenance..." />
          </div>
          <div id="historique-container"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Overlay Reçu (popup) -->
<div id="recu-overlay" class="recu-overlay">
  <div class="recu-card" id="recu-card">
    <!-- Le contenu sera injecté par JS -->
  </div>
</div>

<script>
  (function() {
    // --- Éléments DOM ---
    const pageLogin = document.getElementById('page-login');
    const pageMain = document.getElementById('page-main');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const userEmail = document.getElementById('user-email');

    const navBtns = document.querySelectorAll('.sidebar .nav-btn');
    const subPages = {
      dashboard: document.getElementById('sub-dashboard'),
      depot: document.getElementById('sub-depot'),
      depense: document.getElementById('sub-depense'),
      retrait: document.getElementById('sub-retrait'),
      historique: document.getElementById('sub-historique')
    };

    const recuOverlay = document.getElementById('recu-overlay');
    const recuCard = document.getElementById('recu-card');

    let currentUser = null;

    // --- API ---
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers },
        credentials: 'include'
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');
      return data;
    }

    // --- Navigation ---
    function showPage(pageId) {
      document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));
      Object.values(subPages).forEach(p => p.classList.remove('active'));
      const btn = document.querySelector(`.sidebar .nav-btn[data-page="${pageId}"]`);
      if (btn) btn.classList.add('active');
      if (subPages[pageId]) subPages[pageId].classList.add('active');
      if (pageId === 'dashboard') loadDashboard();
      if (pageId === 'historique') loadHistorique();
    }

    // --- Dashboard ---
    async function loadDashboard() {
      try {
        const data = await apiFetch('/api/dashboard');
        document.getElementById('solde').textContent = data.solde;
        document.getElementById('total-depots').textContent = data.totalDepots;
        document.getElementById('total-depenses').textContent = data.totalDepenses;
        document.getElementById('total-retraits').textContent = data.totalRetraits;
      } catch (err) { console.error('Dashboard error:', err); }
    }

    // --- Historique avec recherche ---
    let historiqueData = [];

    async function loadHistorique() {
      try {
        const data = await apiFetch('/api/historique');
        historiqueData = data.historique;
        renderHistorique(historiqueData);
      } catch (err) {
        document.getElementById('historique-container').innerHTML = '<p style="color:red;">Erreur chargement historique</p>';
      }
    }

    function renderHistorique(data) {
      const container = document.getElementById('historique-container');
      if (data.length === 0) {
        container.innerHTML = '<p>Aucune opération.</p>';
        return;
      }
      let html = `<table>
        <thead><tr>
          <th>Date</th>
          <th>Type</th>
          <th>Montant</th>
          <th>Détails</th>
          <th class="no-print">Action</th>
        </tr></thead><tbody>`;
      data.forEach(item => {
        let details = '';
        let badge = '';
        if (item.type === 'dépôt') {
          details = `Provenance : ${item.provenance}`;
          badge = 'badge-depot';
        } else if (item.type === 'dépense') {
          details = `Motif : ${item.motif}`;
          badge = 'badge-depense';
        } else if (item.type === 'retrait') {
          details = `Mode : ${item.mode}, Client : ${item.nom_client}, Tél : ${item.telephone}, Code : ${item.code_client || 'N/A'}`;
          badge = 'badge-retrait';
        }
        const actionBtn = (item.type === 'retrait' && item.id)
          ? `<button class="btn-secondary" style="padding:4px 12px;font-size:12px;" onclick="viewRecu(${item.id})"><i class="fas fa-file-pdf"></i> Reçu</button>`
          : '';
        html += `<tr>
          <td>${new Date(item.date_creation).toLocaleString()}</td>
          <td><span class="badge ${badge}">${item.type}</span></td>
          <td>${item.montant} FCFA</td>
          <td>${details}</td>
          <td class="no-print">${actionBtn}</td>
        </tr>`;
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // Recherche en temps réel
    document.getElementById('search-historique')?.addEventListener('input', function(e) {
      const search = e.target.value.toLowerCase().trim();
      if (!search) {
        renderHistorique(historiqueData);
        return;
      }
      const filtered = historiqueData.filter(item => {
        const str = JSON.stringify(item).toLowerCase();
        return str.includes(search);
      });
      renderHistorique(filtered);
    });

    // --- Reçu (popup) ---
    window.viewRecu = async function(retraitId) {
      try {
        const data = await apiFetch(`/api/retraits/${retraitId}`);
        const r = data.retrait;
        recuCard.innerHTML = `
          <h2><i class="fas fa-receipt" style="color:#2563eb;"></i> Reçu de retrait</h2>
          <div class="recu-content">
            <p><strong>Code client :</strong> ${r.code_client || 'N/A'}</p>
            <p><strong>ID Retrait :</strong> ${r.id_retrait}</p>
            <p><strong>Montant :</strong> ${r.montant} FCFA</p>
            <p><strong>Mode :</strong> ${r.mode}</p>
            <p><strong>Client :</strong> ${r.nom_client}</p>
            <p><strong>Téléphone :</strong> ${r.telephone}</p>
            <p><strong>Date :</strong> ${new Date(r.date_creation).toLocaleString()}</p>
          </div>
          <div class="recu-actions no-print">
            <button class="btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Imprimer / PDF</button>
            <button class="btn-secondary" onclick="closeRecu()"><i class="fas fa-times"></i> Fermer</button>
          </div>
        `;
        recuOverlay.classList.add('active');
      } catch (err) {
        alert('Erreur chargement du reçu : ' + err.message);
      }
    };

    window.closeRecu = function() {
      recuOverlay.classList.remove('active');
    };

    // Fermer le reçu en cliquant sur l'overlay
    recuOverlay.addEventListener('click', function(e) {
      if (e.target === recuOverlay) closeRecu();
    });

    // --- Login ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      loginError.style.display = 'none';
      try {
        const data = await apiFetch('/api/login', {
          method: 'POST',
          body: JSON.stringify({ email, motDePasse: password })
        });
        currentUser = data.user;
        userEmail.textContent = currentUser.email;
        pageLogin.style.display = 'none';
        pageMain.style.display = 'flex';
        showPage('dashboard');
      } catch (err) {
        loginError.textContent = err.message;
        loginError.style.display = 'block';
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await apiFetch('/api/logout', { method: 'POST' });
      pageMain.style.display = 'none';
      pageLogin.style.display = 'flex';
      currentUser = null;
      closeRecu();
    });

    // Navigation
    navBtns.forEach(btn => {
      btn.addEventListener('click', () => showPage(btn.dataset.page));
    });

    // --- Dépôt ---
    document.getElementById('depot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('depot-montant').value;
      const provenance = document.getElementById('depot-provenance').value;
      const msg = document.getElementById('depot-msg');
      try {
        await apiFetch('/api/depots', { method: 'POST', body: JSON.stringify({ montant, provenance }) });
        msg.className = 'alert success';
        msg.textContent = '✅ Dépôt enregistré avec succès !';
        msg.style.display = 'block';
        document.getElementById('depot-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // --- Dépense ---
    document.getElementById('depense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('depense-montant').value;
      const motif = document.getElementById('depense-motif').value;
      const msg = document.getElementById('depense-msg');
      try {
        await apiFetch('/api/depenses', { method: 'POST', body: JSON.stringify({ montant, motif }) });
        msg.className = 'alert success';
        msg.textContent = '✅ Dépense enregistrée avec succès !';
        msg.style.display = 'block';
        document.getElementById('depense-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // --- Retrait ---
    document.getElementById('retrait-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('retrait-montant').value;
      const mode = document.getElementById('retrait-mode').value;
      const nomClient = document.getElementById('retrait-nom').value;
      const telephone = document.getElementById('retrait-telephone').value;
      const codeClient = document.getElementById('retrait-code').value.toUpperCase();
      const msg = document.getElementById('retrait-msg');
      try {
        const data = await apiFetch('/api/retraits', {
          method: 'POST',
          body: JSON.stringify({ montant, mode, nomClient, telephone, codeClient })
        });
        msg.className = 'alert success';
        msg.textContent = '✅ Retrait enregistré !';
        msg.style.display = 'block';
        document.getElementById('retrait-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
        // Afficher le reçu directement
        window.viewRecu(data.retrait.id);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // --- Vérifier session ---
    async function checkSession() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        userEmail.textContent = currentUser.email;
        pageLogin.style.display = 'none';
        pageMain.style.display = 'flex';
        showPage('dashboard');
      } catch (err) {
        pageLogin.style.display = 'flex';
        pageMain.style.display = 'none';
      }
    }
    checkSession();

    // Exposer viewRecu globalement pour les boutons générés dynamiquement
    window.viewRecu = viewRecu;
    window.closeRecu = closeRecu;
  })();
</script>
</body>
</html>
