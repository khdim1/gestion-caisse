<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de Caisse</title>
  <style>
    /* ----- STYLES GÉNÉRAUX ----- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { width: 100%; max-width: 1300px; height: 90vh; background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; }

    /* ----- HEADER ----- */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; border-bottom: 1px solid #e9ecef; background: #ffffff; }
    .header h1 { font-size: 24px; color: #1a1a2e; }
    .header .user-info { display: flex; align-items: center; gap: 20px; }
    .header .user-info span { font-weight: 500; color: #495057; }
    .btn-logout { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    .btn-logout:hover { background: #c82333; }

    /* ----- BODY AVEC ONGLETS VERTICAUX ----- */
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 220px; background: #f8f9fa; border-right: 1px solid #dee2e6; padding: 20px 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .sidebar .nav-btn { display: block; width: 100%; text-align: left; padding: 12px 24px; background: transparent; border: none; border-radius: 0; font-size: 16px; font-weight: 500; color: #495057; cursor: pointer; transition: 0.2s; border-left: 4px solid transparent; }
    .sidebar .nav-btn:hover { background: #e9ecef; }
    .sidebar .nav-btn.active { background: #ffffff; color: #007bff; border-left-color: #007bff; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
    .content { flex: 1; padding: 30px; overflow-y: auto; background: #ffffff; }

    /* ----- PAGES ----- */
    .page { display: none; }
    .page.active { display: block; }

    /* ----- DASHBOARD ----- */
    .solde { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 30px; }
    .solde h2 { font-size: 28px; font-weight: 300; }
    .solde h2 span { font-size: 48px; font-weight: 700; display: block; margin-top: 8px; }
    .stats { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
    .stat-item { flex: 1; min-width: 150px; background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #e9ecef; }
    .stat-item h3 { font-size: 14px; color: #6c757d; margin-bottom: 6px; }
    .stat-item p { font-size: 24px; font-weight: 700; color: #1a1a2e; }

    /* ----- FORMULAIRES ----- */
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #343a40; }
    .form-group input, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ced4da; border-radius: 8px; font-size: 15px; transition: 0.2s; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #80bdff; box-shadow: 0 0 0 3px rgba(0,123,255,0.25); }
    .btn-primary { background: #007bff; color: white; border: none; padding: 10px 24px; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .btn-primary:hover { background: #0069d9; }
    .alert { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .alert.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    /* ----- TABLEAU HISTORIQUE ----- */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table th { background: #f1f3f5; padding: 12px; text-align: left; font-weight: 600; }
    table td { padding: 12px; border-bottom: 1px solid #e9ecef; }
    table tr:hover { background: #f8f9fa; }

    /* ----- REÇU ----- */
    .recu { max-width: 500px; margin: 20px auto; background: #fff; padding: 30px; border: 1px solid #dee2e6; border-radius: 12px; }
    .recu-content p { margin: 10px 0; }
    .recu-actions { margin-top: 20px; display: flex; gap: 12px; justify-content: center; }
    @media print { .no-print { display: none !important; } .recu { border: none; } }

    /* ----- LOGIN ----- */
    .login-box { max-width: 400px; margin: 60px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    .login-box h1 { text-align: center; margin-bottom: 30px; color: #1a1a2e; }
    .login-box .form-group { margin-bottom: 20px; }
    .login-box .btn-primary { width: 100%; }
  </style>
</head>
<body>
<div class="container" id="app">

  <!-- PAGE LOGIN -->
  <div id="page-login" class="page active" style="display:flex; align-items:center; justify-content:center; height:100%;">
    <div class="login-box">
      <h1>🔐 Connexion</h1>
      <div id="login-error" class="alert error"></div>
      <form id="login-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="exemple@domaine.com">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="login-password" required placeholder="Votre mot de passe">
        </div>
        <button type="submit" class="btn-primary">Se connecter</button>
      </form>
    </div>
  </div>

  <!-- PAGE PRINCIPALE (après login) -->
  <div id="page-main" class="page" style="display:flex; flex-direction:column; height:100%;">
    <!-- Header -->
    <div class="header">
      <h1>💰 Gestion de Caisse</h1>
      <div class="user-info">
        <span id="user-email"></span>
        <button class="btn-logout" id="logout-btn">Déconnexion</button>
      </div>
    </div>

    <!-- Corps avec sidebar -->
    <div class="main">
      <!-- Onglets verticaux -->
      <div class="sidebar" id="sidebar">
        <button class="nav-btn active" data-page="dashboard">📊 Tableau de bord</button>
        <button class="nav-btn" data-page="depot">📥 Nouveau dépôt</button>
        <button class="nav-btn" data-page="depense">📤 Nouvelle dépense</button>
        <button class="nav-btn" data-page="retrait">💳 Nouveau retrait</button>
        <button class="nav-btn" data-page="historique">📜 Historique</button>
      </div>

      <!-- Contenu -->
      <div class="content">
        <!-- Dashboard -->
        <div id="sub-dashboard" class="page active">
          <div class="solde">
            <h2>Solde actuel <span id="solde">0.00</span> FCFA</h2>
          </div>
          <div class="stats">
            <div class="stat-item"><h3>Total dépôts</h3><p id="total-depots">0.00</p></div>
            <div class="stat-item"><h3>Total dépenses</h3><p id="total-depenses">0.00</p></div>
            <div class="stat-item"><h3>Total retraits</h3><p id="total-retraits">0.00</p></div>
          </div>
        </div>

        <!-- Dépôt -->
        <div id="sub-depot" class="page">
          <h2>📥 Enregistrer un dépôt</h2>
          <div id="depot-msg" class="alert"></div>
          <form id="depot-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="depot-montant" required></div>
            <div class="form-group"><label>Provenance</label><input type="text" id="depot-provenance" required placeholder="Ex: Vente, Client, ..."></div>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </form>
        </div>

        <!-- Dépense -->
        <div id="sub-depense" class="page">
          <h2>📤 Enregistrer une dépense</h2>
          <div id="depense-msg" class="alert"></div>
          <form id="depense-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="depense-montant" required></div>
            <div class="form-group"><label>Motif</label><input type="text" id="depense-motif" required placeholder="Ex: Achat fournitures"></div>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </form>
        </div>

        <!-- Retrait -->
        <div id="sub-retrait" class="page">
          <h2>💳 Enregistrer un retrait</h2>
          <div id="retrait-msg" class="alert"></div>
          <form id="retrait-form">
            <div class="form-group"><label>Montant (FCFA)</label><input type="number" step="0.01" id="retrait-montant" required></div>
            <div class="form-group"><label>Mode</label>
              <select id="retrait-mode">
                <option value="Espèce">Espèce</option>
                <option value="Orange Money">Orange Money</option>
                <option value="Wave">Wave</option>
              </select>
            </div>
            <div class="form-group"><label>Nom du client</label><input type="text" id="retrait-nom" required></div>
            <div class="form-group"><label>Numéro de téléphone</label><input type="tel" id="retrait-telephone" required></div>
            <!-- Champ ID retrait retiré, généré automatiquement -->
            <button type="submit" class="btn-primary">Enregistrer et générer le reçu</button>
          </form>
        </div>

        <!-- Historique -->
        <div id="sub-historique" class="page">
          <h2>📜 Historique des opérations</h2>
          <div id="historique-container"></div>
        </div>

        <!-- Zone d'affichage du reçu (cachée) -->
        <div id="recu-container" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // Éléments DOM
    const pageLogin = document.getElementById('page-login');
    const pageMain = document.getElementById('page-main');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');
    const userEmail = document.getElementById('user-email');

    // Sidebar buttons
    const navBtns = document.querySelectorAll('.sidebar .nav-btn');
    const subPages = {
      dashboard: document.getElementById('sub-dashboard'),
      depot: document.getElementById('sub-depot'),
      depense: document.getElementById('sub-depense'),
      retrait: document.getElementById('sub-retrait'),
      historique: document.getElementById('sub-historique')
    };

    let currentUser = null;

    // Fonction API
    async function apiFetch(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...options.headers },
        credentials: 'include'
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erreur serveur');
      return data;
    }

    // Afficher une sous-page
    function showPage(pageId) {
      // Désactiver tous les onglets et pages
      document.querySelectorAll('.sidebar .nav-btn').forEach(b => b.classList.remove('active'));
      Object.values(subPages).forEach(p => p.classList.remove('active'));
      // Activer celui demandé
      const btn = document.querySelector(`.sidebar .nav-btn[data-page="${pageId}"]`);
      if (btn) btn.classList.add('active');
      if (subPages[pageId]) subPages[pageId].classList.add('active');
      // Charger les données si nécessaire
      if (pageId === 'dashboard') loadDashboard();
      if (pageId === 'historique') loadHistorique();
    }

    // Charger le tableau de bord
    async function loadDashboard() {
      try {
        const data = await apiFetch('/api/dashboard');
        document.getElementById('solde').textContent = data.solde;
        document.getElementById('total-depots').textContent = data.totalDepots;
        document.getElementById('total-depenses').textContent = data.totalDepenses;
        document.getElementById('total-retraits').textContent = data.totalRetraits;
      } catch (err) {
        console.error('Dashboard error:', err);
      }
    }

    // Charger l'historique
    async function loadHistorique() {
      try {
        const data = await apiFetch('/api/historique');
        const container = document.getElementById('historique-container');
        if (data.historique.length === 0) {
          container.innerHTML = '<p>Aucune opération.</p>';
          return;
        }
        let html = `<table><thead><tr><th>Date</th><th>Type</th><th>Montant</th><th>Détails</th></tr></thead><tbody>`;
        data.historique.forEach(item => {
          let details = '';
          if (item.type === 'dépôt') details = `Provenance : ${item.provenance}`;
          else if (item.type === 'dépense') details = `Motif : ${item.motif}`;
          else if (item.type === 'retrait') details = `Mode : ${item.mode}, Client : ${item.nom_client}, Tél : ${item.telephone}, ID : ${item.id_retrait}`;
          html += `<tr>
            <td>${new Date(item.date_creation).toLocaleString()}</td>
            <td>${item.type}</td>
            <td>${item.montant} FCFA</td>
            <td>${details}</td>
          </tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
      } catch (err) {
        console.error('Historique error:', err);
        document.getElementById('historique-container').innerHTML = '<p style="color:red;">Erreur chargement historique</p>';
      }
    }

    // Afficher un reçu
    function showRecu(retrait) {
      const container = document.getElementById('recu-container');
      container.style.display = 'block';
      container.innerHTML = `
        <div class="recu no-print">
          <h2>🧾 Reçu de retrait</h2>
          <div class="recu-content">
            <p><strong>ID Retrait :</strong> ${retrait.id_retrait}</p>
            <p><strong>Montant :</strong> ${retrait.montant} FCFA</p>
            <p><strong>Mode :</strong> ${retrait.mode}</p>
            <p><strong>Client :</strong> ${retrait.nom_client}</p>
            <p><strong>Téléphone :</strong> ${retrait.telephone}</p>
            <p><strong>Date :</strong> ${new Date(retrait.date_creation).toLocaleString()}</p>
          </div>
          <div class="recu-actions">
            <button onclick="window.print()" class="btn-primary">🖨️ Imprimer</button>
            <button onclick="document.getElementById('recu-container').style.display='none'" class="btn-primary" style="background:#6c757d;">Fermer</button>
          </div>
        </div>
      `;
      container.scrollIntoView({ behavior: 'smooth' });
    }

    // --- Gestion des événements ---

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      loginError.style.display = 'none';
      try {
        const data = await apiFetch('/api/login', {
          method: 'POST',
          body: JSON.stringify({ email, motDePasse: password })
        });
        currentUser = data.user;
        userEmail.textContent = currentUser.email;
        pageLogin.style.display = 'none';
        pageMain.style.display = 'flex';
        showPage('dashboard');
      } catch (err) {
        loginError.textContent = err.message;
        loginError.style.display = 'block';
      }
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await apiFetch('/api/logout', { method: 'POST' });
      pageMain.style.display = 'none';
      pageLogin.style.display = 'flex';
      currentUser = null;
      document.getElementById('recu-container').style.display = 'none';
    });

    // Navigation par onglets
    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        showPage(btn.dataset.page);
      });
    });

    // Dépôt
    document.getElementById('depot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('depot-montant').value;
      const provenance = document.getElementById('depot-provenance').value;
      const msg = document.getElementById('depot-msg');
      try {
        await apiFetch('/api/depots', {
          method: 'POST',
          body: JSON.stringify({ montant, provenance })
        });
        msg.className = 'alert success';
        msg.textContent = '✅ Dépôt enregistré avec succès !';
        msg.style.display = 'block';
        document.getElementById('depot-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // Dépense
    document.getElementById('depense-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('depense-montant').value;
      const motif = document.getElementById('depense-motif').value;
      const msg = document.getElementById('depense-msg');
      try {
        await apiFetch('/api/depenses', {
          method: 'POST',
          body: JSON.stringify({ montant, motif })
        });
        msg.className = 'alert success';
        msg.textContent = '✅ Dépense enregistrée avec succès !';
        msg.style.display = 'block';
        document.getElementById('depense-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // Retrait
    document.getElementById('retrait-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const montant = document.getElementById('retrait-montant').value;
      const mode = document.getElementById('retrait-mode').value;
      const nomClient = document.getElementById('retrait-nom').value;
      const telephone = document.getElementById('retrait-telephone').value;
      const msg = document.getElementById('retrait-msg');
      try {
        const data = await apiFetch('/api/retraits', {
          method: 'POST',
          body: JSON.stringify({ montant, mode, nomClient, telephone }) // plus d'idRetrait
        });
        msg.className = 'alert success';
        msg.textContent = '✅ Retrait enregistré !';
        msg.style.display = 'block';
        document.getElementById('retrait-form').reset();
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
        showRecu(data.retrait);
      } catch (err) {
        msg.className = 'alert error';
        msg.textContent = '❌ ' + err.message;
        msg.style.display = 'block';
      }
    });

    // Vérifier session existante
    async function checkSession() {
      try {
        const data = await apiFetch('/api/me');
        currentUser = data.user;
        userEmail.textContent = currentUser.email;
        pageLogin.style.display = 'none';
        pageMain.style.display = 'flex';
        showPage('dashboard');
      } catch (err) {
        // Non connecté
        pageLogin.style.display = 'flex';
        pageMain.style.display = 'none';
      }
    }
    checkSession();
  })();
</script>
</body>
</html>
